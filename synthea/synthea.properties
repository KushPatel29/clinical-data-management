# Synthea configuration for this repository's FHIR extract.
#
# Committed instead of the output. The output of a 10,000-patient run is several
# gigabytes of JSON that would take longer to clone than to regenerate, and a
# repository that ships generated data invites the generated data and the
# generator to disagree. What has to be reproducible is the *command*, so the
# command lives here and `fhir/synthea.py` refuses to invent its own settings.
#
# Overridden on the command line by fhir/synthea.py: seed, clinician seed,
# reference date, population, and output directory, because those are the four
# things a caller legitimately varies between the CI sample and a full run.

# --- FHIR R4 export -------------------------------------------------------
# bulk_data=true switches the exporter from one Bundle per patient to one
# NDJSON file per resource type. That is the shape a real FHIR Bulk Data
# Export ($export) produces, so the bulk ingestion path is exercised against
# the format it would actually meet in a hospital integration rather than a
# convenience format invented here. fhir/bulk.py reads both.
exporter.fhir.export = true
exporter.fhir.bulk_data = true
exporter.fhir.use_us_core_ig = true
exporter.hospital.fhir.export = true
exporter.practitioner.fhir.export = true

# Everything else off. Nine other exporters produce formats this warehouse does
# not read, and each one is disk and generation time spent on nothing.
exporter.csv.export = false
exporter.ccda.export = false
exporter.text.export = false
exporter.cpcds.export = false
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.hospital.fhir_stu3.export = false
exporter.hospital.fhir_dstu2.export = false
exporter.practitioner.fhir_stu3.export = false
exporter.practitioner.fhir_dstu2.export = false

# --- Population shape -----------------------------------------------------
# Two years of history rather than a full lifetime. A lifetime of Synthea
# observations is roughly an order of magnitude more Observation rows per
# patient, and those extra rows are all the same three or four LOINC codes —
# they make the extract large without making it more interesting to model. Two
# years is also the window a hospital would realistically hand a sponsor.
exporter.years_of_history = 2

# Living patients only. A deceased-patient cohort is a legitimate thing to
# model, but it changes the meaning of every "active patient panel" measure in
# the semantic layer, and modelling deceased status properly needs the Patient
# .deceased element handled everywhere rather than in one place.
generate.only_alive_patients = true

# Do not append to a previous run's NDJSON files. Without this, generating
# twice silently doubles every count.
exporter.fhir.bulk_data.append = false
